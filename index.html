/* ================= popup menu ================= */
const menuEl = document.getElementById('menu');
function openMenu(anchor, items){
  menuEl.innerHTML = items.map((it,i) => `
    <button data-mi="${i}">
      ${it.swatch ? `<span class="dot" style="background:${it.swatch};width:12px;height:12px;border-radius:4px"></span>` : ''}
      ${it.color ? `<span class="dot" style="background:${it.color}"></span>` : ''}
      ${it.avatar || ''}${esc(it.label)}
    </button>`).join('');
  menuEl.style.display = 'block';
  const r = anchor.getBoundingClientRect();
  const mw = menuEl.offsetWidth, mh = menuEl.offsetHeight;
  menuEl.style.left = Math.max(8, Math.min(r.left, innerWidth - mw - 10)) + 'px';
  menuEl.style.top  = (r.bottom + mh > innerHeight - 10 ? Math.max(8, r.top - mh - 4) : r.bottom + 4) + 'px';
  menuEl.querySelectorAll('button').forEach(btn => {
    btn.onclick = e => { e.stopPropagation(); closeMenu(); items[+btn.dataset.mi].onPick(); };
  });
}
const closeMenu = () => { menuEl.style.display = 'none'; };
document.addEventListener('click', e => { if(!menuEl.contains(e.target)) closeMenu(); }, true);

/* ================= toast / undo ================= */
let toastTimer = null;
function showToast(text, undoFn){
  const el = document.getElementById('toast');
  el.innerHTML = `<span>${esc(text)}</span>${undoFn?'<button id="undoBtn">Undo</button>':''}`;
  el.style.display = 'flex';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.style.display = 'none', 6000);
  if(undoFn) document.getElementById('undoBtn').onclick = () => {
    el.style.display = 'none'; undoFn(); renderAll();
  };
}

/* ================= actions ================= */
document.addEventListener('click', e => {
  if(e.target.id === 'autoModal'){ e.target.classList.remove('open'); return; }
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const {action, id} = el.dataset;

  switch(action){
    case 'select-board':
      state.activeBoard = id; ui.openTask = null; renderAll();
      document.querySelector('aside').classList.remove('open');
      document.getElementById('sidebarBackdrop').classList.remove('open');
      break;

    case 'toggle-sidebar': {
      const open = document.querySelector('aside').classList.toggle('open');
      document.getElementById('sidebarBackdrop').classList.toggle('open', open);
      break;
    }
    case 'close-sidebar':
      document.querySelector('aside').classList.remove('open');
      document.getElementById('sidebarBackdrop').classList.remove('open');
      break;

    case 'add-board': {
      e.stopPropagation();
      const TPLS = [
        {label:'📄 Blank board',       groups:['To do']},
        {label:'🗂 Project plan',      groups:['Planning','Execution','Review','Done ✅']},
        {label:'📅 Content calendar',  groups:['Ideas','Writing','Review','Published']},
        {label:'💼 Sales pipeline',    groups:['Leads','Contacted','Negotiation','Won 🎉']},
        {label:'🎪 Event planning',    groups:['Ideas','To book','Booked','Wrapped up']},
      ];
      openMenu(el, TPLS.map(tp => ({label:tp.label, onPick(){
        const name = prompt('Board name:', tp.label.replace(/^\S+\s/,''));
        if(!name) return;
        const b = {id:uid(), name, autos:[], groups: tp.groups.map((gn,i) =>
          ({id:uid(), name:gn, color:GROUP_COLORS[i % GROUP_COLORS.length], collapsed:false, tasks:[]}))};
        state.boards.push(b); state.activeBoard = b.id;
        log(`Created board "${name}"`); renderAll();
      }})));
      break;
    }

    case 'board-menu': {
      e.stopPropagation();
      openMenu(el, [
        {label:'✏️ Rename board', onPick(){ document.getElementById('boardTitle').focus(); }},
        {label:'📄 Duplicate board', onPick(){
          const src = board();
          const copy = JSON.parse(JSON.stringify(src));
          copy.id = uid(); copy.name = src.name + ' (copy)';
          copy.groups.forEach(g => { g.id = uid(); g.tasks.forEach(t => { t.id = uid(); }); });
          state.boards.push(copy); state.activeBoard = copy.id;
          log(`Duplicated board "${src.name}"`); renderAll();
        }},
        {label:'🧹 Clear completed tasks', onPick(){
          const b = board();
          const n = b.groups.reduce((s,g) => s + g.tasks.filter(t=>t.status==='done').length, 0);
          if(!n){ showToast('No completed tasks to clear'); return; }
          if(!confirm(`Remove ${n} completed task${n>1?'s':''} from "${b.name}"?`)) return;
          b.groups.forEach(g => g.tasks = g.tasks.filter(t => t.status !== 'done'));
          log(`Cleared ${n} completed tasks from "${b.name}"`); renderAll();
        }},
        {label:'🗓 Export calendar (.ics)', onPick(){
          const b = board();
          const blob = new Blob([icsContent(b)], {type:'text/calendar'});
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = b.name.replace(/[^\w]+/g,'-').toLowerCase() + '.ics';
          a.click(); URL.revokeObjectURL(a.href);
          log(`Exported "${b.name}" as a calendar file`);
          showToast('Calendar file downloaded — import it into Apple/Google Calendar');
        }},
        {label:'📊 Export board as CSV', onPick(){
          const b = board();
          const q = v => `"${String(v ?? '').replace(/"/g,'""')}"`;
          const rows = [['Group','Task','Owner','Status','Priority','Start','Due','Tags','Subitems done','Time tracked','Description'].map(q).join(',')];
          for(const g of b.groups) for(const t of g.tasks)
            rows.push([g.name, t.title, member(t.ownerId)?.name || '', statusOf(t).label, priorityOf(t).label,
              t.start || '', t.due || '', (t.tags||[]).join(' '),
              (t.subs||[]).length ? `${t.subs.filter(s=>s.done).length}/${t.subs.length}` : '',
              ttTotal(t) ? fmtDur(ttTotal(t)) : '', t.desc || ''].map(q).join(','));
          const blob = new Blob([rows.join('\n')], {type:'text/csv'});
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = b.name.replace(/[^\w]+/g,'-').toLowerCase() + '.csv';
          a.click(); URL.revokeObjectURL(a.href);
          log(`Exported "${b.name}" as CSV`);
        }},
        {label:'🗑 Delete board', onPick(){
          if(state.boards.length === 1){ showToast('You need at least one board'); return; }
          const b = board(), idx = state.boards.indexOf(b);
          if(!confirm(`Delete board "${b.name}" and all its tasks?`)) return;
          state.boards.splice(idx,1);
          state.activeBoard = state.boards[Math.max(0,idx-1)].id;
          log(`Deleted board "${b.name}"`); renderAll();
          showToast(`Deleted board "${b.name}"`, () => {
            state.boards.splice(Math.min(idx,state.boards.length),0,b); state.activeBoard = b.id;
          });
        }},
      ]);
      break;
    }

    case 'set-view': state.view = el.dataset.view; renderAll(); break;

    case 'cal-prev':  ui.calM--; if(ui.calM<0){ui.calM=11;ui.calY--;} renderAll(); break;
    case 'cal-next':  ui.calM++; if(ui.calM>11){ui.calM=0;ui.calY++;} renderAll(); break;
    case 'cal-today': ui.calY = new Date().getFullYear(); ui.calM = new Date().getMonth(); renderAll(); break;

    case 'add-group': {
      const g = {id:uid(), name:'New group', color:GROUP_COLORS[board().groups.length % GROUP_COLORS.length], collapsed:false, tasks:[]};
      board().groups.push(g); state.view = 'table';
      log('Added a group'); renderAll(); break;
    }

    case 'toggle-group': {
      const g = board().groups.find(g => g.id === id);
      g.collapsed = !g.collapsed; renderAll(); break;
    }

    case 'group-color': {
      e.stopPropagation();
      const g = board().groups.find(g => g.id === id);
      openMenu(el, GROUP_COLORS.map(c => ({label:'', swatch:c, onPick(){ g.color = c; renderAll(); }})));
      break;
    }

    case 'delete-group': {
      const b = board();
      const idx = b.groups.findIndex(g => g.id === id);
      const g = b.groups[idx];
      b.groups.splice(idx,1);
      log(`Deleted group "${g.name}"`); renderAll();
      showToast(`Deleted group "${g.name}" (${g.tasks.length} tasks)`, () => {
        b.groups.splice(Math.min(idx,b.groups.length),0,g);
      });
      break;
    }

    case 'new-task': {
      if(!board().groups.length)
        board().groups.push({id:uid(), name:'To do', color:GROUP_COLORS[0], collapsed:false, tasks:[]});
      state.view = 'table';
      board().groups[0].collapsed = false;
      renderAll();
      const inp = document.querySelector('[data-field="add-task"]');
      if(inp) inp.focus();
      break;
    }

    case 'open-task': ui.openTask = id; renderPanel(); break;
    case 'close-panel': ui.openTask = null; renderPanel(); break;

    case 'delete-task': {
      const f = findTask(id);
      const idx = f.group.tasks.indexOf(f.task);
      f.group.tasks.splice(idx,1);
      if(ui.openTask === id) ui.openTask = null;
      log(`Deleted task "${f.task.title}"`); renderAll();
      showToast(`Deleted "${f.task.title}"`, () => {
        f.group.tasks.splice(Math.min(idx,f.group.tasks.length),0,f.task);
      });
      break;
    }

    case 'pick-status': {
      e.stopPropagation();
      openMenu(el, STATUSES.map(s => ({label:s.label, color:s.color, onPick(){
        const f = findTask(id);
        f.task.status = s.id; log(`"${f.task.title}" → ${s.label}`);
        hist(f.task, `Status → ${s.label}`);
        runAutos(f.board, f.task, {type:'status', to:s.id});
        renderAll();
      }})));
      break;
    }

    case 'pick-priority': {
      e.stopPropagation();
      openMenu(el, PRIORITIES.map(p => ({label:p.label, color:p.color, onPick(){
        const t = findTask(id).task;
        t.priority = p.id; hist(t, `Priority → ${p.label}`); renderAll();
      }})));
      break;
    }

    case 'pick-owner': {
      e.stopPropagation();
      const items = state.members.map(m => ({label:m.name,
        avatar:`<span class="avatar sm" style="background:${m.color}">${esc(m.initials)}</span>`,
        onPick(){
          const {task} = findTask(id);
          task.ownerId = m.id; log(`Assigned "${task.title}" to ${m.name}`);
          hist(task, `Owner → ${m.name}`); renderAll();
        }}));
      items.push({label:'Unassign', onPick(){
        const {task} = findTask(id);
        task.ownerId = null; hist(task, 'Owner → Unassigned'); renderAll();
      }});
      openMenu(el, items);
      break;
    }

    case 'add-member': {
      const name = prompt('Team member name:');
      if(!name || !name.trim()) return;
      state.members.push(mkMember(name.trim(), state.members.length));
      log(`Added ${name.trim()} to the team`); renderAll(); break;
    }

    case 'member-menu': {
      e.stopPropagation();
      const m = member(id);
      openMenu(el, [
        {label:`✏️ Rename ${m.name}`, onPick(){
          const name = prompt('New name:', m.name);
          if(!name || !name.trim()) return;
          m.name = name.trim(); m.initials = m.name.slice(0,2).toUpperCase(); renderAll();
        }},
        {label:'🎨 Change color', onPick(){
          openMenu(el, AVATAR_COLORS.map(c => ({label:'', swatch:c, onPick(){ m.color = c; renderAll(); }})));
        }},
        {label:`🗑 Remove ${m.name}`, onPick(){
          if(!confirm(`Remove ${m.name} from the team? Their tasks become unassigned.`)) return;
          for(const b of state.boards) for(const g of b.groups) for(const t of g.tasks)
            if(t.ownerId === m.id) t.ownerId = null;
          state.members = state.members.filter(x => x.id !== m.id);
          if(state.meId === m.id) state.meId = state.members[0]?.id || null;
          log(`Removed ${m.name} from the team`); renderAll();
        }},
      ]);
      break;
    }

    case 'add-comment': {
      const text = document.getElementById('commentText').value.trim();
      if(!text) return;
      const authorId = document.getElementById('commentAs').value || null;
      state.meId = authorId;
      const {task} = findTask(id);
      (task.comments = task.comments || []).push({id:uid(), authorId, text, ts:Date.now()});
      log(`New update on "${task.title}"`); renderAll();
      break;
    }

    case 'open-autos': {
      board().autos = board().autos || [];
      ui.autoDraft = {wType:'status', wStatus:'done', aType:'move', aParam:'', aText:''};
      renderAutoModal();
      document.getElementById('autoModal').classList.add('open');
      break;
    }
    case 'close-autos': document.getElementById('autoModal').classList.remove('open'); break;

    case 'auto-add': {
      const wType = document.getElementById('awType').value;
      const aType = document.getElementById('aaType').value;
      const param = document.getElementById('aaParam')?.value;
      const rule = {id:uid(), when: wType === 'status'
          ? {type:'status', to: document.getElementById('awStatus').value}
          : {type:'created'}};
      if(aType === 'move')          rule.then = {type:'move', groupId: param};
      else if(aType === 'priority') rule.then = {type:'priority', p: param};
      else if(aType === 'assign')   rule.then = {type:'assign', memberId: param};
      else if(aType === 'slack')    rule.then = {type:'slack', text: document.getElementById('aaText')?.value || ''};
      else                          rule.then = {type:'comment', text: document.getElementById('aaText')?.value || ''};
      if(!['comment','slack'].includes(rule.then.type) && !param){ showToast('Pick a value for the action first'); return; }
      if(rule.then.type === 'slack' && !state.slackWebhook){ showToast('Add your Slack webhook URL below first'); return; }
      board().autos.push(rule);
      log(`⚡ New automation on "${board().name}": ${autoLabel(board(), rule)}`);
      save(); renderAutoModal();
      break;
    }
    case 'auto-del': {
      const b = board();
      b.autos = (b.autos||[]).filter(r => r.id !== id);
      save(); renderAutoModal();
      break;
    }

    case 'form-submit': {
      const title = document.getElementById('fm-title').value.trim();
      if(!title){ showToast('Give the task a name first'); return; }
      const b = board();
      if(!b.groups.length) b.groups.push({id:uid(), name:'To do', color:GROUP_COLORS[0], collapsed:false, tasks:[]});
      const g = b.groups.find(x => x.id === document.getElementById('fm-group').value) || b.groups[0];
      const t = mkTask({
        title,
        desc: document.getElementById('fm-desc').value.trim(),
        ownerId: document.getElementById('fm-owner').value || null,
        priority: document.getElementById('fm-priority').value,
        due: document.getElementById('fm-due').value,
      });
      g.tasks.push(t);
      log(`Added task "${title}" via the form`);
      runAutos(b, t, {type:'created'});
      renderAll();
      showToast(`✅ "${title}" added to ${g.name}`);
      break;
    }

    case 'sub-toggle': {
      const f = findTask(id);
      const s = (f.task.subs||[]).find(s => s.id === el.dataset.sub);
      if(s){ s.done = el.checked; renderAll(); }
      break;
    }
    case 'sub-del': {
      const f = findTask(id);
      f.task.subs = (f.task.subs||[]).filter(s => s.id !== el.dataset.sub);
      renderAll();
      break;
    }

    case 'tt-toggle': {
      const t = findTask(id).task;
      const tt = ttOf(t);
      if(tt.startedAt){
        tt.total += Date.now() - tt.startedAt;
        tt.startedAt = null;
        log(`⏱ Stopped timer on "${t.title}" — ${fmtDur(tt.total)} total`);
      }else{
        tt.startedAt = Date.now();
        log(`⏱ Started timer on "${t.title}"`);
      }
      renderAll();
      break;
    }

    case 'duplicate-task': {
      const f = findTask(id);
      const c = JSON.parse(JSON.stringify(f.task));
      c.id = uid(); c.title += ' (copy)'; c.comments = [];
      c.tt = {total:0, startedAt:null}; c.createdAt = Date.now();
      c.subs = (c.subs||[]).map(s => ({...s, id:uid(), done:false}));
      f.group.tasks.splice(f.group.tasks.indexOf(f.task)+1, 0, c);
      ui.openTask = c.id;
      log(`Duplicated "${f.task.title}"`); renderAll();
      break;
    }

    case 'backups': {
      e.stopPropagation();
      const snaps = snapshots();
      const items = [{label:'📸 Snapshot now', onPick(){
        takeSnapshot('manual');
        showToast('Snapshot saved');
      }}];
      for(const s of snaps){
        const when = new Date(s.ts).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
        const n = (() => { try{ return JSON.parse(s.data).boards.flatMap(b=>b.groups).flatMap(g=>g.tasks).length; }catch(err){ return '?'; } })();
        items.push({label:`↩︎ ${when} · ${n} tasks (${s.reason})`, onPick(){
          if(!confirm(`Restore the backup from ${when}? Your current data will be snapshotted first.`)) return;
          takeSnapshot('pre-restore');
          try{
            state = JSON.parse(s.data);
            if(!state.boards.find(b => b.id === state.activeBoard)) state.activeBoard = state.boards[0]?.id;
            migrate(); ui.openTask = null;
            log(`Restored backup from ${when}`);
            renderAll();
            showToast(`Restored backup from ${when}`);
          }catch(err){ alert('That backup could not be read.'); }
        }});
      }
      if(!snaps.length) items.push({label:'No backups yet — snapshots are taken automatically', onPick(){}});
      openMenu(el, items);
      break;
    }

    case 'toggle-dark': state.dark = !state.dark; renderAll(); break;

    case 'export': {
      const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'teamflow-backup.json';
      a.click(); URL.revokeObjectURL(a.href);
      break;
    }

    case 'toggle-activity': {
      const p = document.getElementById('activity');
      p.style.display = p.style.display === 'block' ? 'none' : 'block';
      break;
    }

    case 'clear-filters': {
      ui.query = ''; ui.fOwner = ''; ui.fStatus = ''; ui.fPriority = ''; ui.sort = 'manual';
      document.getElementById('search').value = '';
      renderAll(); break;
    }
  }
});

/* ---- inline edits: blur ---- */
document.addEventListener('focusout', e => {
  const el = e.target;
  if(el.id === 'boardTitle'){
    const v = el.textContent.trim();
    if(v && v !== board().name){ board().name = v; log(`Renamed board to "${v}"`); }
    renderAll(); return;
  }
  if(el.dataset?.field === 'group-name'){
    const g = board().groups.find(g => g.id === el.dataset.id);
    const v = el.textContent.trim();
    if(v && v !== g.name) g.name = v;
    renderAll(); return;
  }
  if(el.dataset?.field === 'task-title'){
    const {task} = findTask(el.dataset.id);
    const v = el.textContent.trim();
    if(v && v !== task.title) task.title = v;
    renderAll(); return;
  }
  if(el.dataset?.pfield === 'title' && ui.openTask){
    const {task} = findTask(ui.openTask);
    const v = el.textContent.trim();
    if(v && v !== task.title) task.title = v;
    renderAll(); return;
  }
});

/* ---- keyboard ---- */
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    closeMenu();
    document.getElementById('autoModal').classList.remove('open');
    if(ui.openTask){ ui.openTask = null; renderPanel(); }
    return;
  }
  if(e.key !== 'Enter') return;
  const el = e.target;
  if(el.isContentEditable){ e.preventDefault(); el.blur(); return; }
  if(el.dataset?.field === 'add-task'){
    const title = el.value.trim();
    if(!title) return;
    const g = board().groups.find(g => g.id === el.dataset.id);
    const t = mkTask({title});
    g.tasks.push(t);
    log(`Added task "${title}"`);
    runAutos(board(), t, {type:'created'});
    renderAll();
    const inp = document.querySelector(`[data-field="add-task"][data-id="${g.id}"]`);
    if(inp) inp.focus();
    return;
  }
  if(el.dataset?.field === 'sub-add'){
    const v = el.value.trim();
    if(!v) return;
    const t = findTask(el.dataset.id).task;
    (t.subs = t.subs || []).push({id:uid(), title:v, done:false});
    renderAll();
    const inp = document.querySelector(`[data-field="sub-add"][data-id="${t.id}"]`);
    if(inp) inp.focus();
  }
});

/* ---- change events (dates, selects, panel fields, import) ---- */
document.addEventListener('change', e => {
  const el = e.target;

  if(el.dataset?.field === 'due'){
    const t = findTask(el.dataset.id).task;
    t.due = el.value;
    hist(t, `Due date → ${t.due ? fmtDate(t.due) : 'none'}`);
    renderAll(); return;
  }

  if(el.dataset?.pfield && ui.openTask){
    const f = findTask(ui.openTask);
    const t = f.task, p = el.dataset.pfield;
    if(p === 'ownerId'){      t.ownerId = el.value || null;
                              hist(t, `Owner → ${member(t.ownerId)?.name || 'Unassigned'}`); }
    else if(p === 'status'){  t.status = el.value; log(`"${t.title}" → ${statusOf(t).label}`);
                              hist(t, `Status → ${statusOf(t).label}`);
                              runAutos(f.board, t, {type:'status', to:el.value}); }
    else if(p === 'priority'){ t.priority = el.value; hist(t, `Priority → ${priorityOf(t).label}`); }
    else if(p === 'start'){   t.start = el.value; hist(t, `Start date → ${t.start ? fmtDate(t.start) : 'none'}`); }
    else if(p === 'due'){     t.due = el.value; hist(t, `Due date → ${t.due ? fmtDate(t.due) : 'none'}`); }
    else if(p === 'blockedBy') t.blockedBy = el.value || null;
    else if(p === 'desc')     t.desc = el.value;
    else if(p === 'tags')     t.tags = el.value.split(',').map(s=>s.trim()).filter(Boolean);
    else if(p === 'group'){
      const dest = f.board.groups.find(g => g.id === el.value);
      if(dest && dest !== f.group){
        f.group.tasks.splice(f.group.tasks.indexOf(t),1);
        dest.tasks.push(t);
        hist(t, `Moved to group "${dest.name}"`);
      }
    }
    renderAll(); return;
  }

  if(el.id === 'mwPerson'){ state.meId = el.value; renderAll(); return; }
  if(el.id === 'awType'){ ui.autoDraft.wType = el.value; renderAutoModal(); return; }
  if(el.id === 'awStatus'){ ui.autoDraft.wStatus = el.value; return; }
  if(el.id === 'aaType'){ ui.autoDraft.aType = el.value; ui.autoDraft.aParam = ''; renderAutoModal(); return; }
  if(el.id === 'aaParam'){ ui.autoDraft.aParam = el.value; return; }
  if(el.id === 'aaText'){ ui.autoDraft.aText = el.value; return; }
  if(el.id === 'slackHook'){ state.slackWebhook = el.value.trim(); save(); return; }

  if(el.id === 'fOwner'){ ui.fOwner = el.value; renderAll(); return; }
  if(el.id === 'fStatus'){ ui.fStatus = el.value; renderAll(); return; }
  if(el.id === 'fPriority'){ ui.fPriority = el.value; renderAll(); return; }
  if(el.id === 'fSort'){ ui.sort = el.value; renderAll(); return; }

  if(el.id === 'importFile' && el.files[0]){
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const data = JSON.parse(reader.result);
        if(!Array.isArray(data.boards)) throw new Error('bad format');
        takeSnapshot('pre-import');
        state = data;
        if(!state.boards.find(b => b.id === state.activeBoard)) state.activeBoard = state.boards[0]?.id;
        ui.openTask = null;
        log('Imported data from file'); renderAll();
      }catch(err){ alert('Could not import that file — is it a TeamFlow export?'); }
      el.value = '';
    };
    reader.readAsText(el.files[0]);
  }
});

/* ---- search (kept focused across re-renders) ---- */
document.getElementById('search').addEventListener('input', e => {
  ui.query = e.target.value.trim().toLowerCase();
  const val = e.target.value;
  renderAll();
  const s = document.getElementById('search');
  s.value = val; s.focus(); s.setSelectionRange(val.length, val.length);
});

/* ================= drag & drop ================= */
let dragKanban = null;   // task id dragged from a kanban card
let dragRow = null;      // task id dragged from a table row handle

document.addEventListener('dragstart', e => {
  const handle = e.target.closest?.('.drag-handle');
  if(handle){
    const row = handle.closest('.trow');
    dragRow = row.dataset.task;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setDragImage(row, 20, 20);
    return;
  }
  const card = e.target.closest?.('.kcard');
  if(card){ dragKanban = card.dataset.task; e.dataTransfer.effectAllowed = 'move'; }
});

document.addEventListener('dragover', e => {
  if(dragKanban){
    const col = e.target.closest?.('.kcol');
    if(col){
      e.preventDefault();
      document.querySelectorAll('.kcol').forEach(c => c.classList.toggle('dragover', c === col));
    }
    return;
  }
  if(dragRow){
    const row = e.target.closest?.('.trow:not(.head)');
    const tbl = e.target.closest?.('.tbl');
    if(row || tbl){
      e.preventDefault();
      document.querySelectorAll('.trow').forEach(r => r.classList.toggle('drop-above', r === row));
    }
  }
});

document.addEventListener('drop', e => {
  if(dragKanban){
    const col = e.target.closest?.('.kcol');
    document.querySelectorAll('.kcol').forEach(c => c.classList.remove('dragover'));
    if(col){
      e.preventDefault();
      const f = findTask(dragKanban);
      if(f && f.task.status !== col.dataset.status){
        f.task.status = col.dataset.status;
        log(`"${f.task.title}" → ${statusOf(f.task).label}`);
        hist(f.task, `Status → ${statusOf(f.task).label}`);
        runAutos(f.board, f.task, {type:'status', to:f.task.status});
        renderAll();
      }
    }
    dragKanban = null;
    return;
  }
  if(dragRow){
    const row = e.target.closest?.('.trow:not(.head)');
    const tbl = e.target.closest?.('.tbl');
    document.querySelectorAll('.trow').forEach(r => r.classList.remove('drop-above'));
    if(row || tbl){
      e.preventDefault();
      const src = findTask(dragRow);
      if(src){
        src.group.tasks.splice(src.group.tasks.indexOf(src.task), 1);
        if(row && row.dataset.task !== dragRow){
          const dst = findTask(row.dataset.task);
          dst.group.tasks.splice(dst.group.tasks.indexOf(dst.task), 0, src.task);
        }else{
          const gid = (row || tbl).closest('.tbl')?.dataset.group || tbl?.dataset.group;
          const g = board().groups.find(g => g.id === gid) || src.group;
          g.tasks.push(src.task);
        }
        renderAll();
      }
    }
    dragRow = null;
  }
});
document.addEventListener('dragend', () => {
  document.querySelectorAll('.kcol').forEach(c => c.classList.remove('dragover'));
  document.querySelectorAll('.trow').forEach(r => r.classList.remove('drop-above'));
  dragKanban = null; dragRow = null;
});

/* ================= PWA: installable + offline ================= */
if('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstall = e;
  const btn = document.getElementById('installBtn');
  if(btn) btn.style.display = 'block';
});
window.addEventListener('appinstalled', () => {
  deferredInstall = null;
  const btn = document.getElementById('installBtn');
  if(btn) btn.style.display = 'none';
});
document.addEventListener('click', e => {
  if(e.target.closest('[data-action="install-app"]') && deferredInstall){
    deferredInstall.prompt();
    deferredInstall.userChoice.finally(() => { deferredInstall = null; });
  }
});

/* ================= boot ================= */
load();
renderAll();

/* live-updating timer readout while a task card is open */
setInterval(() => {
  const el = document.getElementById('ttLive');
  if(el && ui.openTask){
    const f = findTask(ui.openTask);
    if(f && ttOf(f.task).startedAt) el.textContent = fmtDur(ttTotal(f.task));
  }
}, 1000);
</script>
