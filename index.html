<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TeamFlow — Team Workflow</title>
<meta name="description" content="A custom team workflow tool — boards, automations, timelines, and dashboards.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<meta name="theme-color" content="#6161ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TeamFlow">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --accent:#6161ff;
    --accent-soft:#eceaff;
    --bg:#f6f7fb;
    --panel:#ffffff;
    --border:#e4e7ee;
    --text:#1f2430;
    --muted:#7b8299;
    --done:#00c875;
    --working:#fdab3d;
    --stuck:#e2445c;
    --idle:#c4c4c4;
    --shadow:0 10px 30px rgba(20,20,60,.18);
    --radius:10px;
  }
  :root[data-theme="dark"]{
    --accent:#7a7aff;
    --accent-soft:#2b2c4d;
    --bg:#14161f;
    --panel:#20232f;
    --border:#31354a;
    --text:#e8eaf2;
    --muted:#8f96ad;
    --idle:#9299b5;
    --shadow:0 10px 30px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Inter,Roboto,sans-serif;
    background:var(--bg); color:var(--text); display:flex; overflow:hidden; font-size:14px;
  }
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font:inherit;color:inherit}

  /* ================= Sidebar ================= */
  aside{
    width:248px; min-width:248px; background:#292f4c; color:#e8eaf6;
    display:flex; flex-direction:column; padding:18px 14px; gap:4px;
  }
  #sidebarBackdrop{display:none}
  .hamburger{display:none}
  @media (max-width:820px){
    body{position:relative}
    aside{
      position:fixed; z-index:100; top:0; left:0; bottom:0; transform:translateX(-100%);
      transition:transform .18s ease; box-shadow:0 0 40px rgba(0,0,0,.35);
    }
    aside.open{transform:translateX(0)}
    #sidebarBackdrop{
      display:none; position:fixed; inset:0; z-index:99; background:rgba(10,10,20,.45);
    }
    #sidebarBackdrop.open{display:block}
    .hamburger{
      display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px;
      border-radius:8px; font-size:18px; color:var(--text); flex-shrink:0;
    }
    .hamburger:hover{background:var(--bg)}
    header{padding-left:14px}
    .title-row{gap:10px}
    #view{padding-left:14px; padding-right:14px}
    .filter-bar{padding-left:14px; padding-right:14px}
  }
  .brand{display:flex; align-items:center; gap:10px; padding:0 6px}
  .brand .logo{
    width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#6161ff,#a25ddc);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;color:#fff;
  }
  .brand h1{font-size:17px;font-weight:700}
  .brand small{display:block;font-size:11px;color:#9aa3c7;font-weight:400}
  .savings{
    margin:12px 6px 2px; background:rgba(0,200,117,.14); border:1px solid rgba(0,200,117,.4);
    color:#7dedbb; border-radius:8px; padding:8px 10px; font-size:12px; font-weight:600;
  }
  .side-section{margin-top:16px; padding:0 6px; min-height:0}
  .side-section .label{
    font-size:11px; text-transform:uppercase; letter-spacing:.8px; color:#8790b3;
    display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;
  }
  .side-section .label button{color:#8790b3; font-size:15px; line-height:1; padding:2px 7px; border-radius:5px}
  .side-section .label button:hover{background:rgba(255,255,255,.1); color:#fff}
  .board-item{
    display:flex; align-items:center; gap:8px; width:100%; text-align:left;
    padding:7px 9px; border-radius:7px; color:#c9cfe8; font-size:13.5px;
  }
  .board-item:hover{background:rgba(255,255,255,.07)}
  .board-item.active{background:var(--accent); color:#fff; font-weight:600}
  #team{overflow:auto; max-height:32vh}
  .team-row{
    display:flex; align-items:center; gap:9px; padding:4px 9px; font-size:13px; color:#c9cfe8;
    width:100%; text-align:left; border-radius:7px;
  }
  .team-row:hover{background:rgba(255,255,255,.07)}
  .avatar{
    width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
    font-size:10.5px;font-weight:700;color:#fff; flex-shrink:0;
  }
  .avatar.sm{width:22px;height:22px;font-size:9px}
  .avatar.empty{background:none; border:1.5px dashed #b9c0d4; color:#b9c0d4}
  .side-footer{margin-top:auto; padding:10px 6px 0; display:flex; gap:8px; flex-wrap:wrap}
  .side-footer button,.side-footer label{flex:1 1 44%}
  .side-footer button,.side-footer label{
    flex:1; text-align:center; font-size:12px; color:#c9cfe8; border:1px solid rgba(255,255,255,.18);
    border-radius:7px; padding:7px 4px; cursor:pointer;
  }
  .side-footer button:hover,.side-footer label:hover{background:rgba(255,255,255,.08)}

  /* ================= Main / header ================= */
  main{flex:1; display:flex; flex-direction:column; min-width:0}
  header{padding:16px 26px 0; background:var(--panel); border-bottom:1px solid var(--border)}
  .title-row{display:flex; align-items:center; gap:6px}
  .board-title{
    font-size:22px; font-weight:700; outline:none; border-radius:6px; padding:2px 6px; margin-left:-6px;
    display:inline-block; min-width:60px;
  }
  .board-title:hover,.board-title:focus{background:var(--accent-soft)}
  .icon-btn{color:var(--muted); border-radius:6px; padding:4px 9px; font-size:16px; line-height:1}
  .icon-btn:hover{background:var(--bg); color:var(--text)}
  .stats{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap}
  .chip{
    font-size:12px; background:var(--bg); border:1px solid var(--border); border-radius:20px;
    padding:3px 11px; color:var(--muted); font-weight:600;
  }
  .chip b{color:var(--text)}
  .controls{display:flex; align-items:center; gap:10px; margin:12px 0 0; padding-bottom:10px; flex-wrap:wrap}
  .tabs{display:flex; background:var(--bg); border-radius:8px; padding:3px; gap:2px}
  .tabs button{padding:5px 13px; border-radius:6px; font-size:13px; font-weight:600; color:var(--muted)}
  .tabs button.active{background:var(--panel); color:var(--accent); box-shadow:0 1px 3px rgba(20,20,60,.12)}
  #search{
    border:1px solid var(--border); border-radius:8px; padding:6px 12px; width:190px; outline:none;
    background:var(--bg);
  }
  #search:focus{border-color:var(--accent); background:var(--panel)}
  .spacer{flex:1}
  .btn{background:var(--accent); color:#fff; font-weight:600; border-radius:8px; padding:7px 15px; font-size:13.5px}
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost{background:none; color:var(--muted); border:1px solid var(--border)}
  .btn.ghost:hover{color:var(--text); filter:none; background:var(--bg)}
  .filter-bar{display:flex; align-items:center; gap:8px; padding:9px 26px; background:var(--panel); border-bottom:1px solid var(--border); flex-wrap:wrap}
  .filter-bar .flabel{font-size:12px; color:var(--muted); font-weight:600}
  .filter-bar select{
    border:1px solid var(--border); border-radius:7px; padding:4px 8px; font-size:12.5px;
    background:var(--bg); outline:none; max-width:150px;
  }
  #clearFilters{display:none; font-size:12px; color:var(--accent); font-weight:600; padding:4px 8px; border-radius:6px}
  #clearFilters:hover{background:var(--accent-soft)}

  #view{flex:1; overflow:auto; padding:20px 26px 80px}

  /* ================= Table view ================= */
  .group{margin-bottom:26px}
  .group-header{display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .group-header .caret{color:var(--muted); font-size:11px; width:18px}
  .gdot{width:12px;height:12px;border-radius:4px;display:inline-block;cursor:pointer;flex-shrink:0}
  .group-name{font-weight:700; font-size:15px; outline:none; padding:1px 6px; border-radius:5px}
  .group-name:hover,.group-name:focus{background:var(--accent-soft)}
  .group-count{font-size:12px; color:var(--muted)}
  .group-del{color:var(--muted); font-size:12.5px; opacity:0; padding:2px 7px; border-radius:5px}
  .group-header:hover .group-del{opacity:1}
  .group-del:hover{background:rgba(226,68,92,.12); color:var(--stuck)}
  .progress{height:5px; border-radius:3px; background:var(--border); width:110px; overflow:hidden; margin-left:8px}
  .progress i{display:block; height:100%; background:var(--done)}

  .tbl{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden}
  .trow{
    display:grid; grid-template-columns:24px minmax(230px,1fr) 64px 148px 112px 148px 38px;
    align-items:center; border-bottom:1px solid var(--border); min-height:42px;
    border-left:4px solid transparent; position:relative;
  }
  .trow:last-of-type{border-bottom:none}
  .trow.head{background:var(--bg); font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); min-height:34px; font-weight:600}
  .trow.head>div{padding:0 10px}
  .trow .cell{padding:6px 8px; display:flex; align-items:center; min-width:0; gap:6px}
  .trow.drop-above::before{
    content:''; position:absolute; top:-2px; left:0; right:0; height:3px; background:var(--accent); z-index:2;
  }
  .drag-handle{color:var(--border); cursor:grab; font-size:13px; padding:2px; user-select:none; text-align:center; width:100%}
  .trow:hover .drag-handle{color:var(--muted)}
  .task-title{
    outline:none; padding:3px 6px; border-radius:5px; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .task-title:hover,.task-title:focus{background:var(--accent-soft); white-space:normal}
  .tag{
    font-size:10.5px; font-weight:700; color:#fff; border-radius:10px; padding:2px 8px; white-space:nowrap;
  }
  .cbadge{font-size:11px; color:var(--muted); white-space:nowrap}
  .open-btn{
    font-size:11.5px; font-weight:600; color:var(--accent); border:1px solid var(--border);
    border-radius:6px; padding:2px 8px; opacity:0; white-space:nowrap; background:var(--panel);
  }
  .trow:hover .open-btn{opacity:1}
  .open-btn:hover{background:var(--accent-soft)}
  .pill{
    width:100%; text-align:center; color:#fff; font-weight:600; font-size:12.5px;
    border-radius:5px; padding:6px 4px; white-space:nowrap; overflow:hidden;
  }
  .avatar-btn{border-radius:50%}
  .due-input{
    border:none; background:none; outline:none; color:var(--text); width:100%; font-size:13px;
    padding:4px; border-radius:5px; color-scheme:light dark;
  }
  .due-input:hover,.due-input:focus{background:var(--accent-soft)}
  .due-input.overdue{color:var(--stuck); font-weight:700}
  .del-task{color:var(--muted); font-size:13px; padding:4px 8px; border-radius:5px; opacity:0}
  .trow:hover .del-task{opacity:1}
  .del-task:hover{color:var(--stuck); background:rgba(226,68,92,.12)}
  .add-row{display:flex; border-top:1px solid var(--border)}
  .add-row input{flex:1; border:none; outline:none; padding:10px 16px; font-size:13.5px; background:none}
  .add-row input::placeholder{color:var(--muted)}

  /* ================= Kanban ================= */
  .kanban{display:flex; gap:16px; align-items:flex-start; min-height:100%}
  .kcol{background:var(--bg); border:1px solid var(--border); border-radius:12px; width:268px; min-width:268px; padding:10px}
  :root[data-theme="dark"] .kcol{background:#1a1c28}
  .kcol.dragover{outline:2px dashed var(--accent); outline-offset:-2px}
  .kcol-head{
    color:#fff; font-weight:700; font-size:13.5px; border-radius:8px; padding:8px 12px;
    display:flex; justify-content:space-between; margin-bottom:10px;
  }
  .kcard{
    background:var(--panel); border:1px solid var(--border); border-radius:9px; padding:10px 12px;
    margin-bottom:8px; cursor:pointer; box-shadow:0 1px 2px rgba(20,20,60,.05);
  }
  .kcard .t{font-weight:600; font-size:13.5px; margin-bottom:8px}
  .kcard .meta{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); flex-wrap:wrap}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}
  .kcard .grp{margin-left:auto; font-size:11px}

  /* ================= Calendar ================= */
  .cal-head{display:flex; align-items:center; gap:10px; margin-bottom:14px}
  .cal-head h2{font-size:17px; min-width:170px}
  .cal-head button{border:1px solid var(--border); border-radius:7px; padding:4px 12px; font-size:13px; background:var(--panel)}
  .cal-head button:hover{background:var(--accent-soft)}
  .cal{
    display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:var(--border);
    border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;
  }
  .cal .dow{background:var(--bg); padding:7px 4px; text-align:center; font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase}
  .cal .day{background:var(--panel); min-height:96px; padding:6px; font-size:12px}
  .cal .day .num{color:var(--muted); font-weight:600; margin-bottom:4px}
  .cal .day.other{background:var(--bg)}
  .cal .day.today .num{
    background:var(--accent); color:#fff; border-radius:50%; width:22px; height:22px;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .cal-task{
    display:flex; align-items:center; gap:5px; font-size:11.5px; padding:3px 6px; border-radius:5px;
    margin-bottom:3px; cursor:pointer; background:var(--bg); overflow:hidden; white-space:nowrap;
    text-overflow:ellipsis; width:100%; text-align:left;
  }
  .cal-task:hover{background:var(--accent-soft)}
  .cal-task span{overflow:hidden;text-overflow:ellipsis}

  /* ================= Dashboard ================= */
  .tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:16px}
  .tile{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px}
  .tile .tl{font-size:12px; color:var(--muted); font-weight:600; margin-bottom:6px}
  .tile .tv{font-size:26px; font-weight:800}
  .tile .ts{font-size:12px; color:var(--muted); margin-top:2px}
  .dgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); gap:14px}
  .dcard{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:16px}
  .dcard h3{font-size:13.5px; margin-bottom:14px}
  .battery{display:flex; gap:2px; height:22px; border-radius:6px; overflow:hidden; background:var(--bg)}
  .battery i{display:block; height:100%}
  .legend{display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; font-size:12px; color:var(--muted)}
  .legend b{color:var(--text)}
  .bar-row{display:flex; align-items:center; gap:10px; margin-bottom:9px; font-size:12.5px}
  .bar-row .who{width:104px; display:flex; align-items:center; gap:7px; overflow:hidden; white-space:nowrap; flex-shrink:0}
  .bar-row .track{flex:1; height:14px; border-radius:4px; background:var(--bg); overflow:hidden}
  .bar-row .track i{display:block; height:100%; background:var(--accent); border-radius:0 4px 4px 0; min-width:2px}
  .bar-row .n{width:24px; text-align:right; font-weight:700; font-variant-numeric:tabular-nums}
  .gp-row{display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:12.5px}
  .gp-row .gn{width:120px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-weight:600; flex-shrink:0}
  .gp-row .battery{flex:1; height:14px}
  .gp-row .pc{width:38px; text-align:right; color:var(--muted); font-variant-numeric:tabular-nums}
  .up-row{
    display:flex; align-items:center; gap:10px; padding:7px 4px; border-bottom:1px solid var(--border);
    font-size:12.5px; width:100%; text-align:left; border-radius:4px;
  }
  .up-row:hover{background:var(--bg)}
  .up-row:last-child{border-bottom:none}
  .up-row .ud{width:52px; font-weight:700; color:var(--muted); flex-shrink:0; font-variant-numeric:tabular-nums}
  .up-row .ud.late{color:var(--stuck)}
  .up-row .ut{flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis}

  /* ================= Detail panel ================= */
  #panel{
    position:fixed; z-index:80; top:0; right:-420px; width:400px; height:100vh; background:var(--panel);
    border-left:1px solid var(--border); box-shadow:var(--shadow); transition:right .18s ease;
    display:flex; flex-direction:column;
  }
  #panel.open{right:0}
  .p-head{display:flex; align-items:flex-start; gap:8px; padding:18px 18px 10px}
  .p-title{font-size:17px; font-weight:700; flex:1; outline:none; border-radius:6px; padding:3px 6px; line-height:1.35}
  .p-title:hover,.p-title:focus{background:var(--accent-soft)}
  .p-body{flex:1; overflow:auto; padding:0 18px 20px}
  .p-meta{display:grid; grid-template-columns:96px 1fr; gap:9px 10px; align-items:center; margin-bottom:16px}
  .p-meta label{font-size:12px; color:var(--muted); font-weight:600}
  .p-meta select,.p-meta input{
    border:1px solid var(--border); border-radius:7px; padding:6px 8px; font-size:13px; background:var(--bg);
    outline:none; width:100%; color-scheme:light dark;
  }
  .p-sec{font-size:12px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.6px; margin:16px 0 8px}
  #panel textarea{
    width:100%; border:1px solid var(--border); border-radius:8px; background:var(--bg); padding:9px 10px;
    font-size:13px; resize:vertical; min-height:70px; outline:none;
  }
  #panel textarea:focus{border-color:var(--accent)}
  .comment{border:1px solid var(--border); border-radius:9px; padding:9px 11px; margin-bottom:8px; font-size:13px}
  .comment .ch{display:flex; align-items:center; gap:7px; margin-bottom:5px; font-weight:600; font-size:12.5px}
  .comment .ch small{color:var(--muted); font-weight:400}
  .composer{display:flex; flex-direction:column; gap:8px; margin-top:8px}
  .composer .crow{display:flex; gap:8px; align-items:center}
  .composer select{border:1px solid var(--border); border-radius:7px; padding:5px 8px; font-size:12.5px; background:var(--bg)}
  .composer .btn{align-self:flex-end}

  /* ================= Timeline (Gantt) ================= */
  .tl-toolbar{display:flex; align-items:center; gap:10px; margin-bottom:12px; font-size:12px; color:var(--muted)}
  .tl-wrap{overflow-x:auto; background:var(--panel); border:1px solid var(--border); border-radius:var(--radius)}
  .tl-inner{position:relative}
  .tl-months{display:flex; border-bottom:1px solid var(--border); font-size:11px; font-weight:700; color:var(--muted)}
  .tl-months div{border-right:1px solid var(--border); padding:4px 6px; overflow:hidden; white-space:nowrap; flex-shrink:0}
  .tl-days{display:flex; border-bottom:1px solid var(--border)}
  .tl-day{width:26px; min-width:26px; text-align:center; font-size:10px; color:var(--muted); padding:3px 0}
  .tl-day.today{color:var(--accent); font-weight:800}
  .tl-grid{position:absolute; top:0; bottom:0; left:0; display:flex; pointer-events:none}
  .tl-grid i{width:26px; min-width:26px; display:block}
  .tl-grid i.we{background:var(--bg); opacity:.55}
  .tl-body{position:relative; min-height:30px; padding-bottom:8px}
  .tl-gname{font-size:12px; font-weight:700; padding:8px 10px 4px; position:relative; z-index:2}
  .tl-row{position:relative; height:34px}
  .tl-bar{
    position:absolute; top:4px; height:25px; border-radius:6px; color:#fff; font-size:11.5px; font-weight:600;
    display:flex; align-items:center; padding:0 8px; overflow:hidden; white-space:nowrap; cursor:pointer;
    box-shadow:0 1px 2px rgba(0,0,0,.15); z-index:3;
  }
  .tl-bar:hover{filter:brightness(1.1)}
  .tl-today-line{position:absolute; top:0; bottom:0; width:2px; background:var(--stuck); z-index:4; pointer-events:none}
  .tl-undated{margin-top:10px; font-size:12.5px; color:var(--muted)}

  /* ================= Form view ================= */
  .formwrap{max-width:520px; margin:10px auto}
  .formcard{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:26px 28px; box-shadow:0 4px 18px rgba(20,20,60,.06)}
  .formcard h2{font-size:19px; margin-bottom:4px}
  .formcard .sub{font-size:13px; color:var(--muted); margin-bottom:14px}
  .formcard label{display:block; font-size:12px; font-weight:700; color:var(--muted); margin:12px 0 5px}
  .formcard input[type=text],.formcard textarea,.formcard select,.formcard input[type=date]{
    width:100%; border:1px solid var(--border); border-radius:8px; padding:9px 11px; background:var(--bg);
    outline:none; font-size:13.5px; color-scheme:light dark;
  }
  .formcard input:focus,.formcard textarea:focus,.formcard select:focus{border-color:var(--accent)}
  .formcard .btn{width:100%; margin-top:18px; padding:10px}

  /* ================= My Work ================= */
  .mw-head{display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap}
  .mw-head select{border:1px solid var(--border); border-radius:8px; padding:6px 10px; background:var(--panel); font-size:13.5px}
  .mw-sec{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin-bottom:14px}
  .mw-sec h3{font-size:13px; margin-bottom:8px}
  .mw-sec h3 .n{color:var(--muted); font-weight:600}
  .mw-crumb{font-size:11px; color:var(--muted); white-space:nowrap}

  /* ================= badges / subitems / timer ================= */
  .subbadge{font-size:11px; color:var(--muted); white-space:nowrap}
  .blockbadge{font-size:12px; cursor:default}
  .ttdot{width:7px;height:7px;border-radius:50%;background:var(--stuck);display:inline-block;animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .subrow{display:flex; align-items:center; gap:9px; padding:6px 2px; border-bottom:1px solid var(--border); font-size:13px}
  .subrow:last-of-type{border-bottom:none}
  .subrow input[type=checkbox]{width:15px;height:15px;accent-color:var(--done)}
  .subrow .st{flex:1}
  .subrow .st.done{text-decoration:line-through; color:var(--muted)}
  .subrow .sdel{color:var(--muted); padding:1px 6px; border-radius:4px; opacity:.6}
  .subrow .sdel:hover{color:var(--stuck)}
  .subadd{width:100%; border:none; outline:none; background:none; padding:8px 2px; font-size:13px; color:inherit}
  .ttbox{display:flex; align-items:center; gap:12px; border:1px solid var(--border); border-radius:9px; padding:10px 12px; font-size:13.5px}
  .ttbox b{font-variant-numeric:tabular-nums; font-size:15px}
  .hrow{display:flex; justify-content:space-between; gap:10px; font-size:12px; color:var(--muted);
        padding:5px 2px; border-bottom:1px dashed var(--border)}
  .hrow:last-of-type{border-bottom:none}
  .hrow small{white-space:nowrap; flex-shrink:0}

  /* ================= Automations modal ================= */
  #autoModal{position:fixed; inset:0; z-index:110; background:rgba(15,17,26,.45); display:none; align-items:center; justify-content:center}
  #autoModal.open{display:flex}
  .amodal{background:var(--panel); border:1px solid var(--border); border-radius:14px; width:640px; max-width:92vw; max-height:80vh; overflow:auto; padding:22px 24px}
  .amodal h2{font-size:17px; margin-bottom:2px}
  .amodal .sub{font-size:12.5px; color:var(--muted); margin-bottom:16px}
  .arule{display:flex; align-items:center; gap:8px; border:1px solid var(--border); border-radius:9px; padding:9px 12px; margin-bottom:8px; font-size:13px}
  .arule .txt{flex:1}
  .arule .del{color:var(--muted); padding:2px 7px; border-radius:5px}
  .arule .del:hover{color:var(--stuck); background:rgba(226,68,92,.12)}
  .abuilder{border-top:1px solid var(--border); margin-top:14px; padding-top:14px}
  .abuilder .brow{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; font-size:13px}
  .abuilder select,.abuilder input[type=text]{
    border:1px solid var(--border); border-radius:7px; padding:6px 9px; background:var(--bg); font-size:13px; outline:none; color:inherit;
  }

  /* ================= Menu / toast / activity ================= */
  #menu{
    position:fixed; z-index:120; background:var(--panel); border:1px solid var(--border);
    border-radius:10px; box-shadow:var(--shadow); padding:6px; display:none; min-width:170px; max-height:60vh; overflow:auto;
  }
  #menu button{display:flex; align-items:center; gap:9px; width:100%; text-align:left; padding:8px 10px; border-radius:7px; font-size:13.5px}
  #menu button:hover{background:var(--bg)}
  #toast{
    position:fixed; z-index:130; bottom:22px; left:50%; transform:translateX(-50%);
    background:#292f4c; color:#fff; border-radius:10px; padding:10px 16px; font-size:13.5px;
    display:none; align-items:center; gap:14px; box-shadow:var(--shadow);
  }
  #toast button{color:#9db4ff; font-weight:700}
  #activity{
    position:fixed; z-index:90; top:64px; right:26px; width:330px; max-height:60vh; overflow:auto;
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    box-shadow:var(--shadow); display:none; padding:14px;
  }
  #activity h3{font-size:14px; margin-bottom:10px}
  #activity .item{font-size:12.5px; padding:7px 2px; border-bottom:1px solid var(--border)}
  #activity .item small{display:block; color:var(--muted); margin-top:2px}
  #activity .item:last-child{border-bottom:none}
  .empty-state{color:var(--muted); text-align:center; padding:50px 0; font-size:14px}
</style>
</head>
<body>

<aside>
  <div class="brand">
    <div class="logo">T</div>
    <h1>TeamFlow<small>your team's workflow</small></h1>
  </div>
  <div class="savings">💸 Replaces monday.com — saves ~$6,000/yr</div>

  <div class="side-section">
    <div class="label">Boards <button data-action="add-board" title="New board">＋</button></div>
    <nav id="boards"></nav>
  </div>

  <div class="side-section" style="min-height:0; display:flex; flex-direction:column">
    <div class="label">Team <button data-action="add-member" title="Add member">＋</button></div>
    <div id="team"></div>
  </div>

  <button data-action="install-app" id="installBtn" style="display:none; margin:0 6px 10px; text-align:center; font-size:12px; color:#7dedbb; border:1px solid rgba(0,200,117,.4); background:rgba(0,200,117,.14); border-radius:7px; padding:7px 4px; cursor:pointer">📲 Install app</button>
  <div class="side-footer">
    <button data-action="toggle-dark" id="darkBtn">🌙 Dark</button>
    <button data-action="backups">Backups</button>
    <button data-action="export">Export</button>
    <label for="importFile">Import</label>
    <input type="file" id="importFile" accept=".json" hidden>
  </div>
</aside>
<div id="sidebarBackdrop" data-action="close-sidebar"></div>

<main>
  <header>
    <div class="title-row">
      <button class="hamburger" data-action="toggle-sidebar" title="Menu">☰</button>
      <span class="board-title" id="boardTitle" contenteditable spellcheck="false"></span>
      <button class="icon-btn" data-action="board-menu" title="Board options">⋯</button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="controls">
      <div class="tabs">
        <button id="tab-table" data-action="set-view" data-view="table">Table</button>
        <button id="tab-kanban" data-action="set-view" data-view="kanban">Kanban</button>
        <button id="tab-timeline" data-action="set-view" data-view="timeline">Timeline</button>
        <button id="tab-calendar" data-action="set-view" data-view="calendar">Calendar</button>
        <button id="tab-dashboard" data-action="set-view" data-view="dashboard">Dashboard</button>
        <button id="tab-form" data-action="set-view" data-view="form">Form</button>
        <button id="tab-mywork" data-action="set-view" data-view="mywork">My Work</button>
      </div>
      <input id="search" placeholder="Search tasks & tags…">
      <div class="spacer"></div>
      <button class="btn ghost" data-action="open-autos">⚡ Automate</button>
      <button class="btn ghost" data-action="toggle-activity">Activity</button>
      <button class="btn ghost" data-action="add-group">＋ Group</button>
      <button class="btn" data-action="new-task">＋ New task</button>
    </div>
  </header>
  <div class="filter-bar">
    <span class="flabel">Filter:</span>
    <select id="fOwner"></select>
    <select id="fStatus">
      <option value="">Any status</option>
    </select>
    <select id="fPriority">
      <option value="">Any priority</option>
    </select>
    <span class="flabel" style="margin-left:8px">Sort:</span>
    <select id="fSort">
      <option value="manual">Manual order</option>
      <option value="due">Due date</option>
      <option value="priority">Priority</option>
    </select>
    <button id="clearFilters" data-action="clear-filters">✕ Clear filters</button>
  </div>
  <div id="view"></div>
</main>

<div id="panel"></div>
<div id="menu"></div>
<div id="toast"></div>
<div id="autoModal"></div>
<div id="activity"><h3>Recent activity</h3><div id="activityList"></div></div>

<script>
'use strict';

/* ================= constants ================= */
const STATUSES = [
  {id:'not_started', label:'Not started',   color:'var(--idle)', hex:'#c4c4c4'},
  {id:'working',     label:'Working on it', color:'#fdab3d',     hex:'#fdab3d'},
  {id:'stuck',       label:'Stuck',         color:'#e2445c',     hex:'#e2445c'},
  {id:'done',        label:'Done',          color:'#00c875',     hex:'#00c875'},
];
const PRIORITIES = [
  {id:'low',      label:'Low',      color:'#579bfc', rank:3},
  {id:'medium',   label:'Medium',   color:'#a25ddc', rank:2},
  {id:'high',     label:'High',     color:'#ff642e', rank:1},
  {id:'critical', label:'Critical', color:'#e2445c', rank:0},
];
const GROUP_COLORS  = ['#579bfc','#a25ddc','#00c875','#fdab3d','#e2445c','#4ecccc','#ff642e','#6161ff'];
const AVATAR_COLORS = ['#6161ff','#00a389','#fb8c00','#e2445c','#579bfc','#a25ddc','#4ecccc','#8d6e63'];
const DAY = 86400000;

const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => isoOf(new Date());
const rel = days => { const d = new Date(); d.setDate(d.getDate()+days); return isoOf(d); };
function fmtDur(ms){
  const m = Math.floor(ms/60000), h = Math.floor(m/60);
  if(h) return `${h}h ${pad(m%60)}m`;
  if(m) return `${m}m`;
  return `${Math.max(0, Math.floor(ms/1000))}s`;
}
const ttOf = t => t.tt || (t.tt = {total:0, startedAt:null});
const ttTotal = t => ttOf(t).total + (ttOf(t).startedAt ? Date.now() - ttOf(t).startedAt : 0);
const VIEWS = ['table','kanban','timeline','calendar','dashboard','form','mywork'];
const AUTO_TRIGGERS = [
  {id:'status',  label:'Status changes to'},
  {id:'created', label:'A task is created'},
];
const AUTO_ACTIONS = [
  {id:'move',     label:'move it to group'},
  {id:'priority', label:'set its priority to'},
  {id:'assign',   label:'assign it to'},
  {id:'comment',  label:'post an update on it'},
  {id:'slack',    label:'notify Slack'},
];

/* ================= state ================= */
let state = null;
const ui = {query:'', fOwner:'', fStatus:'', fPriority:'', sort:'manual',
            openTask:null, calY:new Date().getFullYear(), calM:new Date().getMonth(),
            autoDraft:{wType:'status', wStatus:'done', aType:'move', aParam:'', aText:''}};

function mkMember(name, i){
  return {id:uid(), name, initials:name.trim().slice(0,2).toUpperCase(),
          color:AVATAR_COLORS[i % AVATAR_COLORS.length]};
}
function mkTask(o){
  return Object.assign({id:uid(), title:'', desc:'', ownerId:null, status:'not_started',
    priority:'medium', start:'', due:'', tags:[], comments:[], subs:[], blockedBy:null,
    tt:{total:0, startedAt:null}, history:[{ts:Date.now(), text:'Created'}],
    createdAt:Date.now()}, o);
}

function seed(){
  const members = ['Alex','Jamie','Morgan','Taylor'].map(mkMember);
  const [alex, jamie, morgan, taylor] = members.map(m=>m.id);
  const build = mkTask({title:'Homepage build', ownerId:taylor, status:'stuck', priority:'high', start:rel(-1), due:rel(4), tags:['dev'],
    desc:'Blocked on final copy for the hero section.',
    subs:[{id:uid(),title:'Hero section',done:true},{id:uid(),title:'Feature grid',done:false},{id:uid(),title:'Footer & nav',done:false}]});
  return {
    members, activeBoard:null, view:'table', dark:false, meId:members[0].id, activity:[],
    boards:[
      {id:uid(), name:'Getting Started', autos:[], groups:[
        {id:uid(), name:'Try these first', color:GROUP_COLORS[0], collapsed:false, tasks:[
          mkTask({title:'\ud83d\udc4b Welcome to TeamFlow! Hover this row and click "Open" to see the task card', ownerId:alex, status:'working', priority:'high',
            desc:'Every task has a card like this one \u2014 description, subitems, time tracking, tags, dates and a comment thread.\n\nEverything you change is saved automatically.',
            comments:[{id:uid(), authorId:alex, text:'You can discuss any task right here in its thread \ud83d\udcac', ts:Date.now()-DAY}],
            subs:[{id:uid(),title:'Open this card',done:true},{id:uid(),title:'Tick a subitem \u2014 progress shows on the board',done:false}]}),
          mkTask({title:'Click my status pill and set me to Done \u2705', priority:'low'}),
          mkTask({title:'Assign me to someone \u2014 click the avatar circle', priority:'medium'}),
          mkTask({title:'Switch to the Kanban tab and drag me between columns', ownerId:jamie, status:'working', priority:'medium'}),
        ]},
        {id:uid(), name:'Power features', color:GROUP_COLORS[1], collapsed:false, tasks:[
          mkTask({title:'Timeline tab = a full Gantt chart of every dated task', tags:['tip'], start:rel(0), due:rel(3)}),
          mkTask({title:'\u26a1 Automate = no-code rules ("when Done \u2192 move to group\u2026")', tags:['tip'], priority:'high'}),
          mkTask({title:'My Work tab = everything assigned to you, across all boards', tags:['tip']}),
          mkTask({title:'Form tab = a request form that files tasks onto this board', tags:['tip']}),
          mkTask({title:'Track time on any task from its card (a paid add-on elsewhere)', tags:['tip']}),
          mkTask({title:'Add your real team in the sidebar (\uff0b next to Team)', tags:['setup'], priority:'high'}),
        ]},
      ]},
      {id:uid(), name:'Sample Project \u2014 Website Redesign',
       autos:[{id:uid(), when:{type:'status', to:'done'}, then:{type:'comment', text:'Marked done \u2014 this update was posted automatically by a board automation \ud83c\udf89'}}],
       groups:[
        {id:uid(), name:'Planning', color:GROUP_COLORS[2], collapsed:false, tasks:[
          mkTask({title:'Kickoff meeting & goals', ownerId:alex, status:'done', priority:'high', start:rel(-10), due:rel(-9), tags:['planning']}),
          mkTask({title:'Competitive research', ownerId:morgan, status:'done', priority:'medium', start:rel(-8), due:rel(-6), tags:['research']}),
          mkTask({title:'Sitemap & information architecture', ownerId:morgan, status:'working', priority:'high', start:rel(-4), due:rel(1), tags:['planning']}),
        ]},
        {id:uid(), name:'Design', color:GROUP_COLORS[3], collapsed:false, tasks:[
          mkTask({title:'Homepage wireframes', ownerId:jamie, status:'working', priority:'high', start:rel(-6), due:rel(-2), tags:['design'],
            tt:{total:3*3600000+25*60000, startedAt:null},
            comments:[{id:uid(), authorId:jamie, text:'First draft ready \u2014 feedback welcome.', ts:Date.now()-2*DAY}]}),
          mkTask({title:'Design system & components', ownerId:jamie, status:'not_started', priority:'medium', start:rel(2), due:rel(5), tags:['design']}),
          mkTask({title:'Mobile layouts', ownerId:taylor, status:'not_started', priority:'medium', start:rel(5), due:rel(8), tags:['design']}),
        ]},
        {id:uid(), name:'Build & Launch', color:GROUP_COLORS[4], collapsed:false, tasks:[
          build,
          mkTask({title:'CMS setup & content migration', ownerId:alex, status:'not_started', priority:'medium', start:rel(6), due:rel(10), tags:['dev','content']}),
          mkTask({title:'QA & cross-browser testing', ownerId:morgan, status:'not_started', priority:'high', start:rel(11), due:rel(13), tags:['dev'], blockedBy:build.id}),
          mkTask({title:'Launch \ud83d\ude80', ownerId:alex, status:'not_started', priority:'critical', start:rel(15), due:rel(15)}),
        ]},
      ]},
    ],
  };
}

function migrate(){
  state.slackWebhook = state.slackWebhook || '';
  for(const b of state.boards){
    b.autos = b.autos || [];
    for(const g of b.groups) for(const t of g.tasks){
      t.subs = t.subs || [];
      t.tt = t.tt || {total:0, startedAt:null};
      t.start = t.start || '';
      t.blockedBy = t.blockedBy || null;
      t.history = t.history || [];
    }
  }
}

function load(){
  try{
    const raw = localStorage.getItem('teamflow');
    if(raw) state = JSON.parse(raw);
  }catch(e){}
  if(!state || !Array.isArray(state.boards) || !state.boards.length) state = seed();
  if(!state.boards.find(b => b.id === state.activeBoard)) state.activeBoard = state.boards[0].id;
  if(!VIEWS.includes(state.view)) state.view = 'table';
  migrate();
}
/* ---- versioned snapshots (automatic backups with restore) ---- */
const SNAP_KEY = 'teamflow.snapshots';
function snapshots(){
  try{ return JSON.parse(localStorage.getItem(SNAP_KEY)) || []; }catch(e){ return []; }
}
let lastSnapTs = 0;
function takeSnapshot(reason){
  const snaps = snapshots();
  snaps.unshift({ts:Date.now(), reason, data: JSON.stringify(state)});
  while(snaps.length > 12) snaps.pop();
  try{ localStorage.setItem(SNAP_KEY, JSON.stringify(snaps)); }
  catch(e){ snaps.splice(6); try{ localStorage.setItem(SNAP_KEY, JSON.stringify(snaps)); }catch(e2){} }
  lastSnapTs = Date.now();
}
function save(){
  localStorage.setItem('teamflow', JSON.stringify(state));
  if(Date.now() - lastSnapTs > 30*60*1000) takeSnapshot('auto');
}

/* ---- per-task audit history ---- */
function hist(t, text){
  (t.history = t.history || []).unshift({ts:Date.now(), text});
  t.history = t.history.slice(0,30);
}

const board  = () => state.boards.find(b => b.id === state.activeBoard);
const member = id => state.members.find(m => m.id === id);
function findTask(id){
  for(const b of state.boards) for(const g of b.groups){
    const t = g.tasks.find(t => t.id === id);
    if(t) return {board:b, group:g, task:t};
  }
  return null;
}
function log(text){
  state.activity.unshift({ts:Date.now(), text});
  state.activity = state.activity.slice(0,80);
}

/* ================= filtering / sorting ================= */
function matches(t){
  if(ui.query){
    const q = ui.query;
    const inTitle = t.title.toLowerCase().includes(q);
    const inTags = (t.tags||[]).some(tag => tag.toLowerCase().includes(q));
    if(!inTitle && !inTags) return false;
  }
  if(ui.fOwner === 'none'){ if(t.ownerId) return false; }
  else if(ui.fOwner && t.ownerId !== ui.fOwner) return false;
  if(ui.fStatus && t.status !== ui.fStatus) return false;
  if(ui.fPriority && t.priority !== ui.fPriority) return false;
  return true;
}
function sortTasks(list){
  if(ui.sort === 'due')
    return [...list].sort((a,b) => (a.due||'9999-99-99').localeCompare(b.due||'9999-99-99'));
  if(ui.sort === 'priority')
    return [...list].sort((a,b) =>
      PRIORITIES.find(p=>p.id===a.priority).rank - PRIORITIES.find(p=>p.id===b.priority).rank);
  return list;
}
const filtersActive = () => !!(ui.query || ui.fOwner || ui.fStatus || ui.fPriority || ui.sort !== 'manual');

/* ================= small html helpers ================= */
function fmtDate(iso){
  if(!iso) return '';
  return new Date(iso+'T00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});
}
const isOverdue = t => t.due && t.status !== 'done' && t.due < today();
const statusOf   = t => STATUSES.find(s => s.id === t.status) || STATUSES[0];
const priorityOf = t => PRIORITIES.find(p => p.id === t.priority) || PRIORITIES[1];

function avatarHtml(ownerId, sm){
  const m = member(ownerId);
  const cls = 'avatar' + (sm ? ' sm' : '');
  return m
    ? `<span class="${cls}" style="background:${m.color}" title="${esc(m.name)}">${esc(m.initials)}</span>`
    : `<span class="${cls} empty" title="Unassigned">＋</span>`;
}
function tagHtml(tag){
  let h = 0;
  for(const ch of tag) h = (h*31 + ch.charCodeAt(0)) % 360;
  return `<span class="tag" style="background:hsl(${h},55%,46%)">${esc(tag)}</span>`;
}

/* ================= render ================= */
function renderAll(){
  save();
  document.documentElement.dataset.theme = state.dark ? 'dark' : 'light';
  document.getElementById('darkBtn').textContent = state.dark ? '☀️ Light' : '🌙 Dark';
  renderSidebar();
  renderHeader();
  const b = board(), v = document.getElementById('view');
  if(state.view === 'table')          v.innerHTML = tableHtml(b);
  else if(state.view === 'kanban')    v.innerHTML = kanbanHtml(b);
  else if(state.view === 'timeline')  v.innerHTML = timelineHtml(b);
  else if(state.view === 'calendar')  v.innerHTML = calendarHtml(b);
  else if(state.view === 'form')      v.innerHTML = formHtml(b);
  else if(state.view === 'mywork')    v.innerHTML = myWorkHtml();
  else                                v.innerHTML = dashboardHtml(b);
  renderPanel();
  renderActivity();
}

function renderSidebar(){
  document.getElementById('boards').innerHTML = state.boards.map(b => `
    <button class="board-item ${b.id===state.activeBoard?'active':''}" data-action="select-board" data-id="${b.id}">
      <span>📋</span> ${esc(b.name)}
    </button>`).join('');
  document.getElementById('team').innerHTML = state.members.map(m => `
    <button class="team-row" data-action="member-menu" data-id="${m.id}">
      <span class="avatar" style="background:${m.color}">${esc(m.initials)}</span> ${esc(m.name)}
    </button>`).join('') || `<div style="font-size:12px;color:#8790b3;padding:4px 9px">No members yet — click ＋</div>`;
}

function renderHeader(){
  const b = board();
  const titleEl = document.getElementById('boardTitle');
  if(document.activeElement !== titleEl) titleEl.textContent = b.name;

  const tasks = b.groups.flatMap(g => g.tasks);
  const n = k => tasks.filter(t => t.status === k).length;
  const overdue = tasks.filter(isOverdue).length;
  document.getElementById('stats').innerHTML = `
    <span class="chip"><b>${tasks.length}</b> tasks</span>
    <span class="chip">✅ <b>${n('done')}</b> done</span>
    <span class="chip">🔶 <b>${n('working')}</b> in progress</span>
    ${n('stuck')  ? `<span class="chip">🔴 <b>${n('stuck')}</b> stuck</span>` : ''}
    ${overdue     ? `<span class="chip" style="color:var(--stuck)">⚠️ <b>${overdue}</b> overdue</span>` : ''}`;

  for(const v of VIEWS)
    document.getElementById('tab-'+v).classList.toggle('active', state.view === v);

  const fo = document.getElementById('fOwner');
  fo.innerHTML = `<option value="">Everyone</option><option value="none">Unassigned</option>` +
    state.members.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join('');
  fo.value = ui.fOwner;
  const fs = document.getElementById('fStatus');
  if(fs.options.length === 1)
    fs.innerHTML += STATUSES.map(s => `<option value="${s.id}">${s.label}</option>`).join('');
  fs.value = ui.fStatus;
  const fp = document.getElementById('fPriority');
  if(fp.options.length === 1)
    fp.innerHTML += PRIORITIES.map(p => `<option value="${p.id}">${p.label}</option>`).join('');
  fp.value = ui.fPriority;
  document.getElementById('fSort').value = ui.sort;
  document.getElementById('clearFilters').style.display = filtersActive() ? 'inline-block' : 'none';
}

/* ---------- calendar ---------- */
function calendarHtml(b){
  const y = ui.calY, m = ui.calM;
  const first = new Date(y, m, 1);
  const monthName = first.toLocaleDateString(undefined,{month:'long',year:'numeric'});
  const tasks = b.groups.flatMap(g => g.tasks.filter(t => t.due && matches(t)));
  const byDay = {};
  for(const t of tasks) (byDay[t.due] = byDay[t.due] || []).push(t);
  const tod = today();

  let cells = '';
  for(let i=0; i<42; i++){
    const d = new Date(y, m, 1 - first.getDay() + i);   // DST-safe day stepping

    cells += `
      <div class="day ${other?'other':''} ${iso===tod?'today':''}">
        <div class="num">${d.getDate()}</div>
        ${(byDay[iso]||[]).map(t => `

            <span class="dot" style="background:${statusOf(t).color}"></span><span>${esc(t.title)}</span>

  }
  return `
    <div class="cal-head">
      <h2>${monthName}</h2>

      <button data-action="cal-today">Today</button>
      <button data-action="cal-next">›</button>

}

    .map(s => ({s, n:list.filter(t => t.status===s.id).length}))
    .filter(x => x.n)
    .map(x => `<i style="background:${x.s.color};width:${x.n/Math.max(list.length,1)*100}%"

                      n:tasks.filter(t => !t.ownerId && t.status!=='done').length}]

      <div class="tile"><div class="tl">Done</div><div class="tv" style="color:${done?'#00a25b':'inherit'}">${pct}%</div><div class="ts">${done} of ${total} tasks</div></div>
      <div class="tile"><div class="tl">In progress</div><div class="tv">${cnt('working')}</div><div class="ts">${cnt('stuck')} stuck</div></div>
      <div class="tile"><div class="tl">Overdue</div><div class="tv" style="color:${overdue?'var(--stuck)':'inherit'}">${overdue}</div><div class="ts">due date passed</div></div>
    </div>
    <div class="dgrid">
      <div class="dcard">
        <h3>Status breakdown</h3>
        <div class="battery">${batterySeg(tasks) || ''}</div>
        <div class="legend">
          ${STATUSES.map(s => `<span><span class="dot" style="background:${s.color}"></span> ${s.label} <b>${cnt(s.id)}</b>${total?` · ${Math.round(cnt(s.id)/total*100)}%`:''}</span>`).join('')}
        </div>
      </div>
      <div class="dcard">
        <h3>Progress by group</h3>
        ${b.groups.map(g => {

          const gp = g.tasks.length ? Math.round(gd/g.tasks.length*100) : 0;
          return `<div class="gp-row">
            <span class="gn" style="color:${g.color}">${esc(g.name)}</span>
            <div class="battery">${batterySeg(g.tasks)}</div>

        }).join('') || '<div class="empty-state" style="padding:14px 0">No groups</div>'}
      </div>
      <div class="dcard">
        <h3>Open tasks per person</h3>
        ${workRows.map(r => `
          <div class="bar-row">
            <span class="who">${r.av} ${esc(r.label)}</span>

      </div>
    </div>

}

function icsContent(b){
  const escT = s => String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
  const stamp = new Date().toISOString().replace(/[-:]/g,'').slice(0,15) + 'Z';
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//TeamFlow//EN','CALSCALE:GREGORIAN',
                 `X-WR-CALNAME:${escT(b.name)} (TeamFlow)`];
  for(const g of b.groups) for(const t of g.tasks){
    if(!t.due) continue;
    const end = new Date(t.due + 'T00:00'); end.setDate(end.getDate() + 1);
    lines.push('BEGIN:VEVENT',
      `UID:${t.id}@teamflow`,
      `DTSTAMP:${stamp}`,
      `DTSTART;VALUE=DATE:${t.due.replace(/-/g,'')}`,
      `DTEND;VALUE=DATE:${isoOf(end).replace(/-/g,'')}`,
      `SUMMARY:${escT(t.title)}`,
      `DESCRIPTION:${escT(`${b.name} · ${g.name} · ${statusOf(t).label}${member(t.ownerId) ? ' · ' + member(t.ownerId).name : ''}`)}`,
      'END:VEVENT');
  }
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}

function blockedBadge(t){
  if(!t.blockedBy) return '';
  const f = findTask(t.blockedBy);
  if(!f) return '';
  return f.task.status === 'done'
    ? `<span class="blockbadge" title="Was blocked by: ${esc(f.task.title)} — now done">🔓</span>`
    : `<span class="blockbadge" title="Blocked by: ${esc(f.task.title)}">⛔</span>`;
}

/* ---------- timeline (gantt) ---------- */
function timelineHtml(b){
  const dated = b.groups.flatMap(g => g.tasks.filter(t => (t.start || t.due) && matches(t)).map(t => ({g,t})));
  if(!dated.length) return `<div class="empty-state">No tasks with dates yet — open a task and give it a start or due date, and it appears here as a Gantt bar.</div>`;
  let min = dated.map(({t}) => t.start || t.due).reduce((a,c) => c < a ? c : a);
  let max = dated.map(({t}) => t.due || t.start).reduce((a,c) => c > a ? c : a);
  const tod = today();
  if(tod < min) min = tod;
  if(tod > max) max = tod;
  const d0 = new Date(min+'T00:00'); d0.setDate(d0.getDate()-2);
  const d1 = new Date(max+'T00:00'); d1.setDate(d1.getDate()+3);
  const days = [];
  for(let d = new Date(d0); d <= d1; d.setDate(d.getDate()+1)) days.push(new Date(d));
  const CW = 26, W = days.length*CW;
  const idx = iso => Math.round((new Date(iso+'T00:00') - d0) / DAY);

  let months = '', mStart = 0;
  for(let i = 1; i <= days.length; i++){
    if(i === days.length || days[i].getDate() === 1){
      months += `<div style="width:${(i-mStart)*CW}px">${days[mStart].toLocaleDateString(undefined,{month:'long',year:'numeric'})}</div>`;
      mStart = i;
    }
  }
  let body = '';
  for(const g of b.groups){
    const rows = dated.filter(x => x.g === g);
    if(!rows.length) continue;
    body += `<div class="tl-gname" style="color:${g.color}">● ${esc(g.name)}</div>`;
    for(const {t} of rows){
      const s = idx(t.start || t.due), e = idx(t.due || t.start);
      const x = Math.min(s,e)*CW + 1, w = Math.max((Math.abs(e-s)+1)*CW - 3, CW - 3);
      body += `<div class="tl-row">
        <div class="tl-bar" data-action="open-task" data-id="${t.id}"
             style="left:${x}px;width:${w}px;background:${t.status==='done' ? 'var(--done)' : g.color};opacity:${t.status==='done' ? .65 : 1}"
             title="${esc(t.title)} · ${fmtDate(t.start||t.due)} → ${fmtDate(t.due||t.start)} · ${statusOf(t).label}">${esc(t.title)}</div>
      </div>`;
    }
  }
  const undatedN = b.groups.flatMap(g => g.tasks.filter(t => !t.start && !t.due && matches(t))).length;
  return `
    <div class="tl-toolbar">Bars run start → due · green = done · red line = today · click a bar to open the task</div>
    <div class="tl-wrap"><div class="tl-inner" style="width:${W}px">
      <div class="tl-months">${months}</div>
      <div class="tl-days">${days.map(d => `<div class="tl-day ${isoOf(d)===tod?'today':''}">${d.getDate()}</div>`).join('')}</div>
      <div class="tl-body">
        <div class="tl-grid">${days.map(d => `<i class="${d.getDay()%6===0?'we':''}"></i>`).join('')}</div>
        <div class="tl-today-line" style="left:${idx(tod)*CW + CW/2}px"></div>
        ${body}
      </div>
    </div></div>
    ${undatedN ? `<div class="tl-undated">${undatedN} task${undatedN>1?'s':''} without dates — add a start & due date to plot them here.</div>` : ''}`;
}

/* ---------- my work ---------- */
function myWorkHtml(){
  const me = member(state.meId) || state.members[0];
  if(!me) return `<div class="empty-state">Add team members first (＋ next to Team in the sidebar).</div>`;
  const fo = ui.fOwner; ui.fOwner = '';
  const all = [];
  for(const b of state.boards) for(const g of b.groups) for(const t of g.tasks)
    if(t.ownerId === me.id && matches(t)) all.push({b,g,t});
  ui.fOwner = fo;
  const tod = today(), week = rel(7);
  const buckets = [
    {name:'⚠️ Overdue',       test:({t}) => t.status !== 'done' && t.due && t.due < tod},
    {name:'📌 Today',         test:({t}) => t.status !== 'done' && t.due === tod},
    {name:'📅 This week',     test:({t}) => t.status !== 'done' && t.due > tod && t.due <= week},
    {name:'🗂 Later / no date', test:({t}) => t.status !== 'done'},
    {name:'✅ Done',          test:() => true},
  ];
  const used = new Set();
  const row = x => `
    <button class="up-row" data-action="open-task" data-id="${x.t.id}">
      <span class="ud ${isOverdue(x.t)?'late':''}">${x.t.due ? fmtDate(x.t.due) : '—'}</span>
      <span class="ut">${esc(x.t.title)}</span>
      <span class="mw-crumb">${esc(x.b.name)} · <span style="color:${x.g.color}">${esc(x.g.name)}</span></span>
      <span class="dot" style="background:${statusOf(x.t).color}" title="${statusOf(x.t).label}"></span>
    </button>`;
  const secs = buckets.map(bk => {
    const list = all.filter(x => !used.has(x.t.id) && bk.test(x));
    list.forEach(x => used.add(x.t.id));
    if(!list.length) return '';
    return `<div class="mw-sec"><h3>${bk.name} <span class="n">· ${list.length}</span></h3>${list.map(row).join('')}</div>`;
  }).join('');
  return `
    <div class="mw-head">
      <h2 style="font-size:17px">My Work</h2>
      <span style="color:var(--muted);font-size:13px">for</span>
      <select id="mwPerson">${state.members.map(m => `<option value="${m.id}" ${m.id===me.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select>
      <span style="color:var(--muted);font-size:12.5px">— everything assigned to them, across all boards</span>
    </div>
    ${secs || `<div class="empty-state">Nothing assigned to ${esc(me.name)} yet 🎉</div>`}`;
}

/* ---------- automations ---------- */
function autoLabel(b, r){
  const w = r.when.type === 'status'
    ? `status changes to "${(STATUSES.find(s => s.id === r.when.to)||{label:'?'}).label}"`
    : 'a task is created';
  let a = '';
  if(r.then.type === 'move'){ const g = b.groups.find(g => g.id === r.then.groupId); a = `move it to "${g ? g.name : '?'}"`; }
  else if(r.then.type === 'priority') a = `set its priority to ${(PRIORITIES.find(p => p.id === r.then.p)||{label:'?'}).label}`;
  else if(r.then.type === 'assign'){ const m = member(r.then.memberId); a = `assign it to ${m ? m.name : '?'}`; }
  else if(r.then.type === 'comment') a = 'post an update on it';
  else if(r.then.type === 'slack')   a = 'notify Slack';
  return `When ${w} → ${a}`;
}
function runAutos(b, task, evt){
  for(const r of (b.autos || [])){
    const w = r.when;
    const hit = (w.type === 'status' && evt.type === 'status' && evt.to === w.to)
             || (w.type === 'created' && evt.type === 'created');
    if(!hit) continue;
    const a = r.then;
    if(a.type === 'move'){
      const dest = b.groups.find(g => g.id === a.groupId);
      const src  = b.groups.find(g => g.tasks.includes(task));
      if(dest && src && dest !== src){ src.tasks.splice(src.tasks.indexOf(task), 1); dest.tasks.push(task); }
    }
    else if(a.type === 'priority') task.priority = a.p;
    else if(a.type === 'assign')   task.ownerId = a.memberId;
    else if(a.type === 'comment')  (task.comments = task.comments || []).push(
      {id:uid(), authorId:'⚡', text:a.text || 'Automation triggered', ts:Date.now()});
    else if(a.type === 'slack'){
      if(state.slackWebhook){
        fetch(state.slackWebhook, {method:'POST', mode:'no-cors',
          body: JSON.stringify({text:`⚡ TeamFlow — ${a.text || 'automation'}: "${task.title}" (${b.name})`})
        }).catch(()=>{});
      }else{
        log('⚠️ Slack rule ran but no webhook URL is configured (⚡ Automate → Slack webhook)');
      }
    }
    hist(task, `⚡ ${autoLabel(b, r)}`);
    log(`⚡ ${autoLabel(b, r)} — ran on "${task.title}"`);
  }
}
